<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortado Menu | كورتادو منيو</title>
    <style>
        /* التنسيقات الأساسية */
        :root {
            --primary: #1a3a5f;
            --accent: #d32f2f;
            --white: #ffffff;
            --overlay: rgba(0, 0, 0, 0.7);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            overflow-x: hidden;
            transition: background 0.5s ease-in-out;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* شاشة الترحيب */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        .logo-box h1 {
            font-size: 3.5rem;
            color: white;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: white;
            color: var(--primary);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }

        .start-btn:active { transform: scale(0.95); }

        /* القائمة الرئيسية */
        #main-menu {
            display: none;
            padding: 20px;
            min-height: 100vh;
            background: rgba(255,255,255,0.95); /* خلفية بيضاء شفافة */
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        .typewriter {
            font-size: 1.1rem;
            color: var(--primary);
            height: 1.5em;
            font-weight: 500;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        .cat-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .cat-card:hover { transform: translateY(-5px); }

        .cat-card img { width: 55px; height: 55px; margin-bottom: 10px; object-fit: contain; }

        .cat-name { font-weight: bold; font-size: 0.9rem; color: var(--primary); }

        /* عرض الأصناف */
        #section-view {
            display: none;
            padding: 20px;
            min-height: 100vh;
            background: var(--overlay); /* شاشة سوداء شفافة لتوضيح النص */
        }

        .back-btn {
            background: white;
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .items-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.98);
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 6px solid var(--primary);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } }

        .item-info { text-align: right; }
        .en-name { font-size: 0.8rem; color: #666; display: block; }
        .ar-name { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
        .price { font-size: 1rem; font-weight: bold; color: var(--accent); white-space: nowrap; }

    </style>
</head>

        function showMenu() {
            // محاولة تشغيل الصوت الترحيبي
            new Audio('/static/assets/Welcome.mp3').play().catch(e => console.log("Audio play deferred or failed"));
            
            const screen = document.getElementById('welcome-screen');
            screen.style.opacity = '0';
            setTimeout(() => {
                screen.style.display = 'none';
                const mainMenu = document.getElementById('main-menu');
                mainMenu.style.display = 'block';
                // بدء تأثير الكتابة بعد إظهار القائمة
                setTimeout(() => {
                    mainMenu.style.opacity = '1';
                    typeWriter("type-en", "Welcome to Cortado.. Best vibes, better drinks.");
                    setTimeout(() => typeWriter("type-ar", "أهلاً بك في كورتادو.. أفضل قاعدة وأحسن مشاريب"), 1500);
                }, 50);
            }, 800);
        }

        function typeWriter(id, text) {
            let i = 0;
            const el = document.getElementById(id);
            if(!el) return;
            el.innerHTML = "";
            function type() {
                if (i < text.length) { el.innerHTML += text.charAt(i); i++; setTimeout(type, 50); }
            }
            type();
        }

        function loadSection(id, imgName) {
            // تغيير خلفية الموقع بناءً على القسم
            document.body.style.backgroundImage = `url('/static/assets/${imgName}')`;
            
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('section-view').style.display = 'block';
            
            const list = document.getElementById('items-list');
            list.innerHTML = ""; // مسح الأصناف السابقة
            
            // إضافة الأصناف الجديدة
            if(menuData[id]) {
                menuData[id].forEach(item => {
                    list.innerHTML += `
                        <div class="item-card">
                            <div class="item-info">
                                <span class="en-name">${item.en}</span>
                                <span class="ar-name">${item.ar}</span>
                            </div>
                            <div class="price">${item.price} EGP</div>
                        </div>`;
                });
            }
            window.scrollTo(0,0); // العودة لأعلى الصفحة
        }

        function backToMain() {
            // إزالة خلفية القسم والعودة للقائمة الرئيسية
            document.body.style.backgroundImage = "none";
            document.getElementById('section-view').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
            window.scrollTo(0,0);
        }
